<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6C5CE7;--primary-light:#A29BFE;--bg:#F5F3FF;
  --card-bg:#fff;--text:#1a1a2e;--text-light:#666;--danger:#f53f3f;
  --success:#00b42a;--radius:16px;--shadow:0 4px 20px rgba(108,92,231,0.1);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden}
.page{display:none;padding:16px 16px 160px;min-height:100vh}
.page.active{display:block}

/* Tab Bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card-bg);display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);box-shadow:0 -2px 12px rgba(0,0,0,0.06);z-index:100}
.tab-item{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--text-light);gap:4px;padding:4px 0;cursor:pointer;min-width:56px}
.tab-item.active{color:var(--primary)}
.tab-icon{font-size:22px}

/* Cards */
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.header-card{background:linear-gradient(135deg,#6C5CE7,#A29BFE);color:#fff;padding:24px;border-radius:var(--radius);margin-bottom:16px}
.countdown-days{font-size:56px;font-weight:700;line-height:1}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card-bg);padding:16px;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow)}
.stat-val{font-size:28px;font-weight:700;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text-light);margin-top:4px}

/* Progress */
.progress-bar{height:10px;background:rgba(255,255,255,0.25);border-radius:5px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:#fff;border-radius:5px;transition:width .3s}
.progress-bar-dark{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:6px 0}
.progress-fill-color{height:100%;border-radius:4px;transition:width .3s}

/* Task List */
.task-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card-bg);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.task-left{display:flex;align-items:center;gap:12px}
.task-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.task-info{flex:1;min-width:0}
.task-q{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{font-size:12px;color:var(--text-light);margin-top:2px}

/* Buttons */
.btn{display:block;text-align:center;padding:14px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;border:none;margin:16px 0;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{border:2px solid var(--primary);color:var(--primary);background:transparent}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}

/* Practice */
.practice-card{background:var(--card-bg);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);text-align:center}
.practice-q{font-size:18px;font-weight:600;margin:20px 0;line-height:1.6}
.answer-box{background:#F5F3FF;padding:16px;border-radius:12px;margin:16px 0;text-align:left;border-left:4px solid var(--primary);white-space:pre-line;line-height:1.6}
.action-row{display:flex;gap:12px}
.action-row .btn{flex:1;margin:0}

/* Flash Card */
.flash-card{background:var(--card-bg);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);text-align:center}
.card-subject{font-size:12px;padding:4px 12px;border-radius:20px;margin-bottom:16px;font-weight:600}
.tag-zyk{background:#722ed1;color:#fff}
.tag-yy{background:#0fc19c;color:#fff}
.tag-default{background:var(--primary-light);color:#fff}

.tap-hint{color:var(--text-light);font-size:13px;margin-top:20px}

/* Filter */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;white-space:nowrap}
.filter-chip{padding:6px 16px;border-radius:20px;font-size:13px;background:var(--card-bg);color:var(--text-light);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* Cards List */
.card-item{background:var(--card-bg);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}

.card-meta{font-size:12px;color:var(--text-light)}
.study-btn{font-size:13px;color:var(--primary);padding:6px 16px;border:1px solid var(--primary);border-radius:20px;cursor:pointer}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal-content{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-close{font-size:28px;color:var(--text-light);cursor:pointer;line-height:1}
.form-group{margin-bottom:16px}
.form-label{font-size:14px;font-weight:600;margin-bottom:6px;display:block}
.form-input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none;background:#f9f9f9}
.form-textarea{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none;min-height:80px;resize:vertical;background:#f9f9f9;font-family:inherit}

/* Empty */
.empty{text-align:center;padding:60px 20px}
.empty-icon{font-size:56px}
.empty-text{color:var(--text-light);margin:12px 0;font-size:15px}

/* Timer */
.timer{background:var(--card-bg);padding:16px;border-radius:var(--radius);text-align:center;margin-bottom:16px;box-shadow:var(--shadow)}
.timer-text{font-size:36px;font-weight:700;color:var(--primary)}

/* Chart */
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;height:200px;gap:8px;padding-top:20px}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1}
.bar{width:100%;border-radius:6px 6px 0 0;background:var(--primary-light);min-height:4px}
.bar-label{font-size:11px;color:var(--text-light);margin-top:6px}
.bar-val{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}

/* Bottom bar */
.bottom-bar{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:8px;padding:8px 16px;background:var(--bg);z-index:50}
.bottom-btn{padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;background:var(--card-bg);box-shadow:var(--shadow);flex:1;transition:transform .1s}
.bottom-btn:active{transform:scale(.97)}

/* Overview Grid */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.overview-item{text-align:center;padding:12px}
.overview-val{font-size:24px;font-weight:700;color:var(--primary)}
.overview-unit{font-size:12px;color:var(--text-light)}
.overview-label{font-size:12px;color:var(--text-light);margin-top:2px}

.section-title{font-size:16px;font-weight:700;margin-bottom:12px}
</style>

function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {

    const v = c === 'x' ? r : (r & 0x3 | 0x8);

// ========== Supabase 数据操作 ==========
async function loadFromSupabase(){
  // 加载卡片
  const {data: cardData, error: cardErr} = await supabaseClient.from('cards').select('*');
  if(cardErr){console.error('加载卡片出错', cardErr); cards = [];}

async function saveCardsToSupabase(c){

async function saveRecordsToSupabase(r){

const CARDS_KEY = 'mmll_cards', RECORDS_KEY = 'mmll_records';

function saveToLocal(){

// ========== 云端存储 ==========
async function loadFromCloud(){
  try{
    // 查询卡片
    const cardQuery = new AV.Query(CARD_CLASS);
    cardQuery.equalTo('userId', currentUser.id);
    const cardResults = await cardQuery.find();
    if(cardResults.length > 0){
      cards = cardResults.map(c => ({
        id: c.id, question: c.get('question'), answer: c.get('answer'),
        subject: c.get('subject'), tag: c.get('tag'), srsLevel: c.get('srsLevel') || 1,
        nextReview: c.get('nextReview'), successCount: c.get('successCount') || 0,
        failCount: c.get('failCount') || 0
      }));
    }else if(cards.length===0){
      cards = mockCards;
    }
    
    // 查询记录
    const recQuery = new AV.Query(RECORD_CLASS);
    recQuery.equalTo('userId', currentUser.id);
    const recResults = await recQuery.find();
    records = recResults.map(r => ({
      id: r.id, cardId: r.get('cardId'), isCorrect: r.get('isCorrect'),
      subject: r.get('subject'), createdAt: r.get('createdAt')
    }));
    
    saveToLocal();
    renderApp();
  }catch(e){
    console.log('加载云端数据失败', e);
    loadFromLocal();
  }
}

async function saveCardsToSupabase(c){
  cards = c;
  saveToLocal();
  if(!lcInitialized) return;
  
  // 同步到云端
  try{
    const query = new AV.Query(CARD_CLASS);
    query.equalTo('userId', currentUser.id);
    const existing = await query.find();
    
    // 删除旧数据
    await AV.Object.destroyAll(existing);
    
    // 保存新数据
    const toSave = cards.map(card => {
      const obj = new AV.Object(CARD_CLASS);
      obj.set('userId', currentUser.id);
      obj.set('question', card.question);
      obj.set('answer', card.answer);
      obj.set('subject', card.subject);
      obj.set('tag', card.tag);
      obj.set('srsLevel', card.srsLevel || 1);
      obj.set('nextReview', card.nextReview);
      obj.set('successCount', card.successCount || 0);
      obj.set('failCount', card.failCount || 0);
      return obj;
    });
    
    await AV.Object.saveAll(toSave);
    console.log('卡片已同步到云端');
  }catch(e){
    console.log('同步卡片失败', e);
  }
}

async function saveRecordsToSupabase(r){
  records = r;
  saveToLocal();
  if(!lcInitialized) return;
  
  try{
    const query = new AV.Query(RECORD_CLASS);
    query.equalTo('userId', currentUser.id);
    const existing = await query.find();
    await AV.Object.destroyAll(existing);
    
    const toSave = records.map(rec => {
      const obj = new AV.Object(RECORD_CLASS);
      obj.set('userId', currentUser.id);
      obj.set('cardId', rec.cardId);
      obj.set('isCorrect', rec.isCorrect);
      obj.set('subject', rec.subject);
      obj.set('createdAt', rec.createdAt);
      return obj;
    });
    
    await AV.Object.saveAll(toSave);
    console.log('记录已同步到云端');
  }catch(e){
    console.log('同步记录失败', e);
  }
}

function goPage(page,data){
  currentPage=page
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'))
  const el=document.getElementById('page-'+page)
  if(el)el.classList.add('active')
  const tab=document.querySelector(`[data-page="${page}"]`)
  if(tab)tab.classList.add('active')
  window.scrollTo(0,0)
  render(page,data)
}

// ========== Render ==========
function render(page,data){
  switch(page){
    case 'today':renderToday();break
    case 'cards':renderCards();break
    case 'practice':renderPractice();break
    case 'wrong':renderWrong();break
    case 'stats':renderStats();break
    case 'study':renderStudy(data);break
    case 'exam':renderExam(data);break
    case 'exam-result':renderExamResult(data);break
    case 'upload':renderUpload();break
  }
}

function h(tag,attrs,...children){
  const el=document.createElement(tag)
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==='className')el.className=v
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v)
    else if(k==='style')Object.assign(el.style,v)
    else el.setAttribute(k,v)
  }
  for(const c of children){
    if(typeof c==='string')el.appendChild(document.createTextNode(c))
    else if(c instanceof Node)el.appendChild(c)
    else if(Array.isArray(c))c.forEach(cc=>el.appendChild(typeof cc==='string'?document.createTextNode(cc):cc))
  }
  return el
}

// ========== Cards Page ==========
function renderCards(filterSubj,filterTag){
  if(!filterSubj)filterSubj='全部'
  if(!filterTag)filterTag='全部'
  const subjects=['全部','专业课','英语','政治']
  // 获取所有标签，包括空标签的卡片数量
  const tagMap={}
  cards.forEach(c=>{if(c.tag){tagMap[c.tag]=(tagMap[c.tag]||0)+1}})
  const allTags=['全部',...Object.keys(tagMap).sort()]
  let filtered=filterSubj==='全部'?cards:cards.filter(c=>c.subject===filterSubj)
  filtered=filterTag==='全部'?filtered:filtered.filter(c=>c.tag===filterTag)
  const getTag=s=>{if(s==='政治')return'tag-zyk';if(s==='英语')return'tag-yy';return'tag-default'}

  document.getElementById('page-cards').innerHTML=''
  document.getElementById('page-cards').appendChild(
    h('div',{},
      h('div',{className:'filter-bar'},
        subjects.map(s=>h('div',{className:'filter-chip'+(filterSubj===s?' active':''),onClick:()=>renderCards(s,filterTag)},s))
      ),
      allTags.length>1?h('div',{className:'filter-bar',style:{marginTop:'8px',flexWrap:'wrap'}},
        allTags.map(t=>h('div',{className:'filter-chip'+(filterTag===t?' active':''),onClick:()=>renderCards(filterSubj,t),style:{fontSize:'12px'}},t+(t!=='全部'?' ('+(tagMap[t]||0)+')':'')))
      ):null,
      filtered.length>0
        ? h('div',{},...filtered.map(c=>h('div',{className:'card-item'},
            h('div',{className:'card-header'},
              h('span',{className:'card-subject '+getTag(c.subject)},c.subject),
              h('span',{className:'srs-badge'},'SRS Lv.'+c.srsLevel)
            ),
            h('div',{style:{fontSize:'15px',fontWeight:600,marginBottom:'8px'}},c.question),
            h('div',{style:{fontSize:'13px',color:'#666',whiteSpace:'pre-line',lineHeight:1.5}},c.answer.slice(0,80)+(c.answer.length>80?'...':'')),
            h('div',{className:'card-footer'},
              h('span',{className:'card-meta'},(c.tag||'无标签')+' · 成功'+c.successCount+'次/失败'+c.failCount+'次'),
              h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'8px'}},
                h('span',{className:'study-btn',style:{flex:1,minWidth:'70px',textAlign:'center'},onClick:()=>goPage('study',{cards:[c],index:0})},'学习'),
                h('span',{className:'study-btn',style:{flex:1,minWidth:'70px',textAlign:'center',background:'#fff3e0',color:'#ff9800',border:'none'},onClick:()=>showEditModal(c)},'编辑'),
                h('span',{className:'study-btn',style:{flex:1,minWidth:'70px',textAlign:'center',background:'#fee',color:'var(--danger)',border:'none'},onClick:()=>deleteCard(c.id)},'删除')
              )
            )
          )))
        : h('div',{className:'empty'},h('div',{className:'empty-icon'},'📚'),h('div',{className:'empty-text'},'暂无卡片'),h('div',{className:'btn btn-primary',onClick:showAddModal},'添加第一张卡片'))
      ,
      h('div',{className:'bottom-bar'},
        h('div',{className:'bottom-btn',onClick:()=>goPage('upload')},'📥 导入JSON'),
        h('div',{className:'bottom-btn',onClick:()=>goPage('exam',{cards})},'📝 模拟考试'),
        h('div',{className:'bottom-btn',style:{background:'var(--primary)',color:'#fff'},onClick:showAddModal},'+ 添加卡片')

  const allTags=['全部',...new Set(wrongCards.map(c=>c.tag).filter(Boolean))]
  if(filterTag!=='全部')wrongCards=wrongCards.filter(c=>c.tag===filterTag)

    h('div',{className:'modal',onClick:()=>root.innerHTML=''},
      h('div',{className:'modal-content',onClick:e=>e.stopPropagation(),style:{maxWidth:'300px'}},
        h('div',{style:{fontSize:'24px',textAlign:'center',marginBottom:'12px'}},'⚠️'),
        h('div',{style:{fontSize:'16px',fontWeight:600,textAlign:'center',marginBottom:'8px'}},'确认移除'),
        h('div',{style:{fontSize:'14px',color:'#666',textAlign:'center',marginBottom:'16px'}},'确定要从错题本中移除这道题吗？'),
        h('div',{style:{display:'flex',gap:'12px'}},
          h('div',{className:'btn btn-outline',style:{flex:1},onClick:()=>root.innerHTML=''},'取消'),
          h('div',{className:'btn btn-primary',style:{flex:1,background:'var(--danger)'},onClick:()=>{
            records=records.filter(r=>!(r.cardId===cardId&&!r.isCorrect))
            saveRecords(records)
            root.innerHTML=''
            renderWrong()
          }},'移除')
        )
      )
    )
  )
}

// ========== Stats Page ==========
function renderStats(){
  const today=new Date().toISOString().slice(0,10)
  const todayRecs=records.filter(r=>r.createdAt?.startsWith(today))
  const allCorrect=records.filter(r=>r.isCorrect).length
  const accuracy=records.length?Math.round(allCorrect/records.length*100):0

  const subjects=['专业课','英语','政治']
  const colors=['#722ed1','#0fc19c','#165dff']
  const subData=subjects.map((n,i)=>({name:n,total:cards.filter(c=>c.subject===n).length,learned:cards.filter(c=>c.subject===n&&c.successCount>0).length,color:colors[i]}))

  const dayNames=['周日','周一','周二','周三','周四','周五','周六']
  const weekly=dayNames.map(d=>({day:d,count:0}))
  const weekAgo=Date.now()-7*86400000
  records.forEach(r=>{const t=new Date(r.createdAt).getTime();if(t>weekAgo){const d=new Date(r.createdAt).getDay();weekly[d].count++}})
  const maxW=Math.max(...weekly.map(d=>d.count),1)

  document.getElementById('page-stats').innerHTML=''
  document.getElementById('page-stats').appendChild(
    h('div',{},
      h('div',{className:'card'},
        h('div',{className:'section-title'},'学习概览'),
        h('div',{className:'overview-grid'},
          h('div',{className:'overview-item'},h('div',{className:'overview-val'},cards.length,h('span',{className:'overview-unit'},'张')),h('div',{className:'overview-label'},'总卡片')),
          h('div',{className:'overview-item'},h('div',{className:'overview-val'},todayRecs.length,h('span',{className:'overview-unit'},'张')),h('div',{className:'overview-label'},'今日已学')),
          h('div',{className:'overview-item'},h('div',{className:'overview-val'},accuracy,h('span',{className:'overview-unit'},'%')),h('div',{className:'overview-label'},'正确率')),
          h('div',{className:'overview-item'},h('div',{className:'overview-val'},records.length,h('span',{className:'overview-unit'},'次')),h('div',{className:'overview-label'},'总练习'))
        )
      ),
      h('div',{className:'card'},
        h('div',{className:'section-title'},'近7天学习量'),
        h('div',{className:'bar-chart'},
          weekly.map(w=>h('div',{className:'bar-col'},
            h('div',{className:'bar-val'},String(w.count)),
            h('div',{className:'bar',style:{height:Math.max((w.count/maxW*160),4)+'px'}}),
            h('div',{className:'bar-label'},w.day)
          ))
        )
      ),
      h('div',{className:'card'},
        h('div',{className:'section-title'},'科目进度'),
        subData.map(s=>h('div',{style:{marginBottom:'16px'}},
          h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'14px',marginBottom:'4px'}},
            h('span',{},s.name),h('span',{style:{color:s.color}},s.total>0?Math.round(s.learned/s.total*100)+'%':'0%')
          ),
          h('div',{className:'progress-bar-dark'},h('div',{className:'progress-fill-color',style:{width:(s.total>0?(s.learned/s.total*100):0)+'%',background:s.color}}))
        ))
      ),
      h('div',{className:'btn btn-outline',onClick:()=>goPage('today')},'返回首页')
    )
  )
}

// ========== Exam Page ==========
function renderExam(data){
  const examCards=(data&&data.cards)||cards
  if(!examState.timer){examState={timeLeft:30*60,index:0,showAnswer:false,correct:0,timer:null};examState.timer=setInterval(()=>{examState.timeLeft--;if(examState.timeLeft<=0){clearInterval(examState.timer);goPage('exam-result',{total:examCards.length,correct:examState.correct})}renderExam()},1000)}
  document.getElementById('page-exam').innerHTML=''
  if(examState.index>=examCards.length){clearInterval(examState.timer);goPage('exam-result',{total:examCards.length,correct:examState.correct});return}
  const c=examCards[examState.index]
  const min=Math.floor(examState.timeLeft/60),sec=examState.timeLeft%60
  document.getElementById('page-exam').appendChild(
    h('div',{},
      h('div',{className:'timer'},h('div',{style:{fontSize:'13px',marginBottom:'4px'}},'⏱️ 剩余时间'),h('div',{className:'timer-text'},String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0'))),
      h('div',{style:{textAlign:'center',marginBottom:'16px',color:'#666'}},(examState.index+1)+'/'+examCards.length),
      h('div',{className:'flash-card'},
        h('div',{className:'card-q'},c.question),
        examState.showAnswer?h('div',{style:{background:'#F5F3FF',padding:'16px',borderRadius:'12px',margin:'16px 0',textAlign:'left',width:'100%',borderLeft:'4px solid var(--primary)'}},h('span',{style:{fontWeight:600}},'答案：'),' ',c.answer):null
      ),
      h('div',{className:'action-row',style:{margin:'16px 0'}},
        !examState.showAnswer
          ? h('div',{className:'btn btn-primary',onClick:()=>{examState.showAnswer=true;renderExam()}},'显示答案')
          : [
              h('div',{className:'btn btn-outline',style:{borderColor:'#ff9800',color:'#ff9800'},onClick:()=>{
                records=[...records,{id:Date.now()+'_'+Math.random().toString(36).slice(2,8),cardId:c.id,isCorrect:false,subject:c.subject,createdAt:new Date().toISOString()}]
                saveRecords(records)
                examState.index++;examState.showAnswer=false;renderExam()
              }},'💪 下次一定'),
              h('div',{className:'btn btn-primary',onClick:()=>{
                examState.correct++
                records=[...records,{id:Date.now()+'_'+Math.random().toString(36).slice(2,8),cardId:c.id,isCorrect:true,subject:c.subject,createdAt:new Date().toISOString()}]
                saveRecords(records)
                examState.index++;examState.showAnswer=false;renderExam()
              }},'🌟 很棒！')
            ]
      )
    )
  )
}

// ========== Exam Result ==========
function renderExamResult(data){
  if(examState.timer){clearInterval(examState.timer);examState.timer=null}
  const total=data?.total||0,correct=data?.correct||0,rate=total>0?Math.round(correct/total*100):0
  document.getElementById('page-exam-result').innerHTML=''
  document.getElementById('page-exam-result').appendChild(
    h('div',{className:'card',style:{textAlign:'center',padding:'60px 20px'}},
      h('div',{style:{fontSize:'56px',marginBottom:'16px'}},'🎉'),
      h('div',{style:{fontSize:'22px',fontWeight:700,marginBottom:'8px'}},'考试结束！'),
      h('div',{style:{fontSize:'48px',fontWeight:700,color:'var(--primary)',margin:'16px 0'}},rate+'%'),
      h('div',{style:{color:'#666',marginBottom:'8px'}},'共 '+total+' 题，正确 '+correct+' 题'),
      h('div',{className:'btn btn-primary',onClick:()=>{examState={timeLeft:0,index:0,showAnswer:false,correct:0,timer:null};goPage('today')}},'返回首页'),
      h('div',{className:'btn btn-outline',onClick:()=>goPage('cards')},'查看题库')
    )
  )
}

// ========== Import Page ==========

function renderUpload(){
  document.getElementById('page-upload').innerHTML=''
  document.getElementById('page-upload').appendChild(
    h('div',{},
      h('div',{className:'card'},
        h('div',{className:'section-title'},'📥 导入题库'),
        h('div',{style:{fontSize:'14px',color:'#666',marginBottom:'16px'}},'使用题库生成器将 PDF 转为 JSON，再导入'),
        h('input',{type:'file',accept:'.json',style:{display:'none'},id:'json-input',onChange:e=>handleJsonImport(e.target.files[0])}),
        h('div',{className:'card',onClick:()=>document.getElementById('json-input').click(),
          style:{border:'2px dashed var(--primary-light)',textAlign:'center',padding:'40px 20px',cursor:'pointer',background:'#fafafa'}},
          h('div',{style:{fontSize:'40px',marginBottom:'12px'}},'📄'),
          h('div',{style:{fontSize:'16px',fontWeight:600,color:'var(--primary)'}},'选择 JSON 文件导入'),
          h('div',{style:{fontSize:'12px',color:'#999',marginTop:'4px'}},'由题库生成器导出的 .json 文件')
        ),
        h('div',{style:{marginTop:'20px'}},h('div',{style:{fontSize:'14px',fontWeight:600,marginBottom:'8px'}},'或者粘贴 JSON')),
        h('textarea',{id:'json-paste',className:'form-textarea',placeholder:'[{"question":"...","answer":"...","subject":"专业课","tag":"..."}]',style:{minHeight:'100px',fontSize:'12px'}}),
        h('div',{className:'btn btn-primary',style:{marginTop:'8px'},onClick:()=>{
          try{const d=JSON.parse(document.getElementById('json-paste').value||'[]');if(!Array.isArray(d))throw new Error('需要数组');importCards(d)}catch(e){alert('JSON错误：'+e.message)}
        }},'导入 JSON'),
        h('div',{style:{marginTop:'16px',fontSize:'13px',color:'#666',padding:'12px',background:'#f0eeff',borderRadius:'8px'}},
          h('div',{style:{fontWeight:600,marginBottom:'4px'}},'💡 如何使用'),
          h('div',{},'1. 浏览器打开 tool/generator.html'),
          h('div',{},'2. 上传PDF → 标记填空 → 导出JSON'),
          h('div',{},'3. 回到此处导入')
        )
      )
    )
  )
}
function importCards(data){const imported=data.map(item=>({id:generateUUID(),question:item.question||'',answer:item.answer||'',subject:item.subject||'专业课',tag:item.tag||'',srsLevel:1,nextReview:new Date().toISOString().slice(0,10),successCount:0,failCount:0,createdAt:new Date().toISOString(),userId:'local'}));cards=[...imported,...cards];saveCards(cards);goPage('cards')}
function handleJsonImport(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw new Error('需要数组格式');importCards(d)}catch(e){alert('JSON错误：'+e.message)}};r.readAsText(file)}

// ========== Tab Bar Events ==========
document.querySelectorAll('.tab-item').forEach(el=>{
  el.addEventListener('click',()=>{
    const page=el.dataset.page
    if(page==='practice')practiceState={index:0,showAnswer:false,correct:0,wrongIds:[],userAnswer:''}
    if(examState.timer&&page!=='exam'){clearInterval(examState.timer);examState.timer=null}
    goPage(page)
  })
})

// ========== Init ==========
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js')
renderToday()
</script>
</body>
</html>
