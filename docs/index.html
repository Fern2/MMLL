*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6C5CE7;--primary-light:#A29BFE;--bg:#F5F3FF;
  --card-bg:#fff;--text:#1a1a2e;--text-light:#666;--danger:#f53f3f;

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden}
.page{display:none;padding:16px 16px 160px;min-height:100vh}
.page.active{display:block}

/* Tab Bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card-bg);display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);box-shadow:0 -2px 12px rgba(0,0,0,0.06);z-index:100}
.tab-item{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--text-light);gap:4px;padding:4px 0;cursor:pointer;min-width:56px}
.tab-item.active{color:var(--primary)}
.tab-icon{font-size:22px}

/* Cards */
.card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.header-card{background:linear-gradient(135deg,#6C5CE7,#A29BFE);color:#fff;padding:24px;border-radius:var(--radius);margin-bottom:16px}
.countdown-days{font-size:56px;font-weight:700;line-height:1}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-item{background:var(--card);border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:transform .1s}
.menu-item:active{transform:scale(.98)}
.menu-icon{font-size:28px;margin-bottom:8px}
.menu-title{font-size:14px;font-weight:600;color:var(--text)}
.menu-desc{font-size:11px;color:var(--text-light);margin-top:2px}
.stat-card{background:var(--card-bg);padding:16px;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow)}
.stat-val{font-size:28px;font-weight:700;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text-light);margin-top:4px}

/* Progress */
.progress-bar{height:10px;background:rgba(255,255,255,0.25);border-radius:5px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:#fff;border-radius:5px;transition:width .3s}
.progress-bar-dark{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:6px 0}
.progress-fill-color{height:100%;border-radius:4px;transition:width .3s}

/* Task List */
.task-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card-bg);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.task-left{display:flex;align-items:center;gap:12px}
.task-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.task-info{flex:1;min-width:0}
.task-q{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{font-size:12px;color:var(--text-light);margin-top:2px}

/* Buttons */
.btn{display:block;text-align:center;padding:14px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;border:none;margin:16px 0;transition:transform .1s}

.btn-primary{background:var(--primary);color:#fff}
.btn-outline{border:2px solid var(--primary);color:var(--primary);background:transparent}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}

.modal-content{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px;max-height:80vh;overflow-y:auto}

.form-group{margin-bottom:16px}

.form-input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none;background:#f9f9f9}
.form-textarea{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;outline:none;min-height:80px;resize:vertical;background:#f9f9f9;font-family:inherit}

/* Empty */

/* Timer */

/* Chart */

.bar-val{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}

/* Bottom bar */

// ========== Supabase 数据操作 ==========
async function loadFromSupabase(){
  // 加载卡片
  const {data: cardData, error: cardErr} = await supabaseClient.from('cards').select('*');
  if(cardErr){
    console.error('加载卡片出错', cardErr); 
    cards = [];
  } else {
    // 将 snake_case 转换为 camelCase
    cards = cardData.map(card => {
      const base = {
        id: card.id,
        question: card.question || '',
        answer: card.answer || '',
        subject: card.subject || '专业课',
        tag: card.tag || '',
        srsLevel: card.srs_level || 1,
        nextReview: card.next_review || new Date().toISOString().slice(0, 10),
        successCount: card.success_count || 0,
        failCount: card.fail_count || 0
      };
      
      // 检查是否是PDF遮挡卡片（旧格式）
      if (card.type === 'pdf-mask' && card.pdf_data) {
        base.type = card.type;
        base.fileName = card.file_name;
        base.pdfData = card.pdf_data;
        base.pageCount = card.page_count;
        base.masks = card.masks ? JSON.parse(card.masks) : null;
      }
      
      // 检查是否是PDF遮挡卡片（新格式，数据存储在question字段）
      if (card.answer === 'pdf-mask-card') {
        try {
          const pdfData = JSON.parse(card.question);
          if (pdfData.type === 'pdf-mask' && pdfData.pdfData) {
            base.type = pdfData.type;
            base.fileName = pdfData.fileName;
            base.pdfData = pdfData.pdfData;
            base.pageCount = pdfData.pageCount;
            base.masks = pdfData.masks;
            base.question = '';
          }
        } catch (e) {
          console.error('解析PDF卡片数据失败', e);
        }
      }
      
      return base;
    });
  }
  // 加载记录
  const {data: recData, error: recErr} = await supabaseClient.from('records').select('*');
  if(recErr){console.error('加载记录出错', recErr); records = [];}
  else {records = recData;}
  // 本地存储备份（防止离线使用）
  localStorage.setItem('mmll_cards', JSON.stringify(cards));
  localStorage.setItem('mmll_records', JSON.stringify(records));
  renderApp();
}

const CARDS_KEY = 'mmll_cards', RECORDS_KEY = 'mmll_records';
function loadFromLocal(){
  try{cards = JSON.parse(localStorage.getItem(CARDS_KEY)||'[]')}catch{cards=[]}

function saveToLocal(){

  localStorage.setItem(RECORDS_KEY,JSON.stringify(records));
}

async function saveCardsToSupabase(c){
  // 更新卡片并同步到 Supabase
  cards = c;
  // 本地备份
  localStorage.setItem('mmll_cards', JSON.stringify(cards));
  
  // 将卡片数据映射为与 Supabase 表字段对应的 snake_case 格式
  // 使用JSON字段存储PDF卡片的额外数据，避免表结构变更
  const formatted = cards.map(card => {
    const base = {
      id: card.id,
      question: card.question || '',
      answer: card.answer || '',
      subject: card.subject,
      tag: card.tag,
      srs_level: card.srsLevel,
      next_review: card.nextReview,
      success_count: card.successCount,
      fail_count: card.failCount
    };
    
    // 如果是PDF遮挡卡片，将额外数据存储在question或answer字段中
    if (card.type === 'pdf-mask' && card.pdfData) {
      base.question = JSON.stringify({
        type: card.type,
        fileName: card.fileName,
        pdfData: card.pdfData,
        pageCount: card.pageCount,
        masks: card.masks
      });
      base.answer = 'pdf-mask-card';
    }
    
    return base;
  });
  
  // 使用upsert同步到云端
  const {error: upsertErr} = await supabaseClient.from('cards').upsert(formatted, { onConflict: 'id' });
  if(upsertErr) console.error('同步卡片失败', upsertErr);
}

async function saveRecordsToSupabase(r){
  // 更新记录并同步到 Supabase
  records = r;
  // 本地备份
  localStorage.setItem('mmll_records', JSON.stringify(records));
  // 将记录映射为与 Supabase 表字段对应的 snake_case
  const formatted = records.map(rec => ({
    id: rec.id,
    card_id: rec.cardId,
    is_correct: rec.isCorrect,
    subject: rec.subject,
    created_at: rec.createdAt
  }));
  // 使用upsert同步到云端
  const {error: upsertErr} = await supabaseClient.from('records').upsert(formatted, { onConflict: 'id' });
  if(upsertErr) console.error('同步记录失败', upsertErr);
}

let currentPage = 'home'

let practiceState = {index:0,showAnswer:false,correct:0,wrongIds:[],userAnswer:''}

function goPage(page,data){
  currentPage=page
  
  // 隐藏所有页面并清空内容
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.remove('active')
    p.style.display = 'none'
  })
  // 取消所有 tab 的激活状态
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'))
  
  // 显示目标页面
  const pageEl=document.getElementById('page-'+page)
  if(pageEl){
    pageEl.innerHTML = ''
    pageEl.classList.add('active')
    pageEl.style.display = 'block'
  }
  
  // 激活对应的 tab
  const tab=document.querySelector(`[data-page="${page}"]`)
  if(tab)tab.classList.add('active')
  
  window.scrollTo(0,0)
  render(page,data)
}

    case 'home':renderHome();break
    case 'cards':renderCards();break
    case 'practice':renderPracticeHub();break
    case 'recite':renderReciteHub();break
    case 'study':renderStudy(data);break
    case 'wrong':renderWrong();break
    case 'stats':renderStats();break
    case 'exam':renderExam(data);break
    case 'exam-result':renderExamResult(data);break
    case 'upload':renderUpload();break
    case 'pdf-mask':renderPdfMaskStudy(data);break
  }
}

function h(tag,attrs,...children){
  const el=document.createElement(tag)
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==='className')el.className=v
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v)
    else if(k==='style'){
      for(const[sk,sv]of Object.entries(v)){
        el.style[sk]=sv
      }
    }
    else el.setAttribute(k,v)
  }
  for(const c of children){
    if(typeof c==='string')el.appendChild(document.createTextNode(c))
    else if(c instanceof Node)el.appendChild(c)
    else if(Array.isArray(c))c.forEach(cc=>el.appendChild(typeof cc==='string'?document.createTextNode(cc):cc))
  }
  return el
}

  const allTags=['全部',...Object.keys(tagMap).sort()]
  let filtered=filterSubj==='全部'?cards:cards.filter(c=>c.subject===filterSubj)
  filtered=filterTag==='全部'?filtered:filtered.filter(c=>c.tag===filterTag)

// PDF 学习页面 - 切换页码
async function studyChangePage(delta, card) {
  const newPage = Math.max(1, Math.min(card.pageCount || 1, (studyState.currentPage || 1) + delta));
  studyState.currentPage = newPage;
  
  // 更新页码显示
  document.getElementById('studyPageInfo').textContent = `第 ${newPage} / ${card.pageCount} 页`;
  document.getElementById('studyPrevBtn').disabled = newPage <= 1;
  document.getElementById('studyNextBtn').disabled = newPage >= card.pageCount;
  
  // 重新渲染 PDF 和遮挡
  await renderStudyPdfMask(card, false);
}

// 渲染学习页面的 PDF 遮挡卡片
async function renderStudyPdfMask(card, isNewCard = true) {
  if (!card.pdfData) return;
  
  try {
    const bytes = base64ToUint8Array(card.pdfData);
    
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    const page = await pdf.getPage(studyState.currentPage || 1);
    const scale = 1.5;
    const viewport = page.getViewport({ scale });
    
    const canvas = document.getElementById('studyPdfCanvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    
    await page.render({
      canvasContext: ctx,
      viewport: viewport
    }).promise;
    
    // 渲染遮挡
    if (isNewCard) {
      studyState.revealedMasks = [];
    }
    
    const container = document.getElementById('studyPdfContainer');
    if (!container) return;
    
    // 移除旧的遮挡
    container.querySelectorAll('.study-mask').forEach(el => el.remove());
    
    // 添加当前页的遮挡
    card.masks?.filter(m => m.page === (studyState.currentPage || 1)).forEach((mask, i) => {
      const isRevealed = studyState.revealedMasks?.includes(mask.page + '-' + i);
      
      const maskEl = document.createElement('div');
      maskEl.className = 'study-mask';
      maskEl.style.cssText = `
        position: absolute;
        left: ${mask.left}px;
        top: ${mask.top}px;
        width: ${mask.width}px;
        height: ${mask.height}px;
        background: ${isRevealed ? 'transparent' : 'linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%)'};
        border-radius: 4px;
        cursor: pointer;
        opacity: ${isRevealed ? 0 : 1};
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 12px;
        transition: all 0.2s;
        border: ${isRevealed ? '2px solid #ff9800' : 'none'};
      `;
      maskEl.innerHTML = isRevealed ? '✅' : '✋';
      maskEl.title = isRevealed ? '已显示答案' : '点击显示答案';
      
      maskEl.onclick = () => {
        const key = mask.page + '-' + i;
        if (!studyState.revealedMasks) studyState.revealedMasks = [];
        
        if (studyState.revealedMasks.includes(key)) {
          studyState.revealedMasks = studyState.revealedMasks.filter(k => k !== key);
        } else {
          studyState.revealedMasks.push(key);
        }
        
        // 重新渲染遮挡
        maskEl.style.background = studyState.revealedMasks.includes(key) ? 'transparent' : 'linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%)';
        maskEl.style.opacity = studyState.revealedMasks.includes(key) ? 0 : 1;
        maskEl.innerHTML = studyState.revealedMasks.includes(key) ? '✅' : '✋';
        maskEl.style.border = studyState.revealedMasks.includes(key) ? '2px solid #ff9800' : 'none';
        maskEl.title = studyState.revealedMasks.includes(key) ? '已显示答案' : '点击显示答案';
      };
      
      container.appendChild(maskEl);
    });
    
    // 更新按钮状态
    const currentPage = studyState.currentPage || 1;
    document.getElementById('studyPrevBtn').disabled = currentPage <= 1;
    document.getElementById('studyNextBtn').disabled = currentPage >= card.pageCount;
    
  } catch (error) {
    console.error('渲染PDF失败:', error);
  }
}

// Uint8Array 转 Base64 - 支持所有字节值
function uint8ArrayToBase64(uint8Array) {
  const base64Chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  let result = '';
  
  for (let i = 0; i < uint8Array.length; i += 3) {
    const byte1 = uint8Array[i];
    const byte2 = uint8Array[i + 1] || 0;
    const byte3 = uint8Array[i + 2] || 0;
    
    // 计算每个6位块
    const chunk1 = byte1 >> 2;
    const chunk2 = ((byte1 & 0x03) << 4) | (byte2 >> 4);
    const chunk3 = ((byte2 & 0x0F) << 2) | (byte3 >> 6);
    const chunk4 = byte3 & 0x3F;
    
    result += base64Chars[chunk1];
    result += base64Chars[chunk2];
    
    if (i + 1 >= uint8Array.length) {
      result += '=';
    } else {
      result += base64Chars[chunk3];
    }
    
    if (i + 2 >= uint8Array.length) {
      result += '=';
    } else {
      result += base64Chars[chunk4];
    }
  }
  
  return result;
}

// Base64 转 Uint8Array - 支持所有字节值
function base64ToUint8Array(base64) {
  const base64Chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const padding = base64.split('=').length - 1;
  const length = (base64.length * 3 / 4) - padding;
  const uint8Array = new Uint8Array(length);
  
  let index = 0;
  for (let i = 0; i < base64.length; i += 4) {
    const char1 = base64Chars.indexOf(base64[i]);
    const char2 = base64Chars.indexOf(base64[i + 1]);
    const char3 = base64Chars.indexOf(base64[i + 2]);
    const char4 = base64Chars.indexOf(base64[i + 3]);
    
    const byte1 = (char1 << 2) | (char2 >> 4);
    const byte2 = ((char2 & 0x0F) << 4) | (char3 >> 2);
    const byte3 = ((char3 & 0x03) << 6) | char4;
    
    uint8Array[index++] = byte1;
    if (i + 2 < base64.length && base64[i + 2] !== '=') {
      uint8Array[index++] = byte2;
    }
    if (i + 3 < base64.length && base64[i + 3] !== '=') {
      uint8Array[index++] = byte3;
    }
  }
  
  return uint8Array;
}

async function renderPdfMaskPage() {
  const card = pdfMaskState.card;
  if (!card || !document.getElementById('pdfMaskCanvas')) return;
  const container = document.getElementById('pdfMaskContainer');
  
  try {
    // 检查PDF数据
    if (!card.pdfData) {
      throw new Error('PDF数据为空');
    }
    
    const bytes = base64ToUint8Array(card.pdfData);
    if (!bytes || bytes.length < 10) {
      throw new Error('PDF数据无效');
    }
    
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    const page = await pdf.getPage(pdfMaskState.currentPage);
    
    // 使用与编辑器相同的固定缩放比例，确保遮挡区域位置一致
    const scale = 1.5;
    pdfMaskState.scale = scale;
    
    const scaledViewport = page.getViewport({ scale: pdfMaskState.scale });
    
    const canvas = document.getElementById('pdfMaskCanvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;
    
    await page.render({
      canvasContext: ctx,
      viewport: scaledViewport
    }).promise;
    
    // 渲染遮挡
    // 移除旧的遮挡
    container.querySelectorAll('.pdf-mask-item').forEach(el => el.remove());
    
    // 添加当前页的遮挡
    card.masks?.filter(m => m.page === pdfMaskState.currentPage).forEach((mask, i) => {
      const maskKey = mask.page + '-' + i;
      const isRevealed = pdfMaskState.revealedMasks.includes(maskKey);
      
      const maskEl = document.createElement('div');
      maskEl.className = 'pdf-mask-item';
      maskEl.style.cssText = `
        position: absolute;
        left: ${mask.left * pdfMaskState.scale}px;
        top: ${mask.top * pdfMaskState.scale}px;
        width: ${mask.width * pdfMaskState.scale}px;
        height: ${mask.height * pdfMaskState.scale}px;
        background: ${isRevealed ? 'transparent' : 'linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%)'};
        border-radius: 4px;
        cursor: pointer;
        opacity: ${isRevealed ? 0 : 1};
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 11px;
        font-weight: bold;
        transition: all 0.3s;
        border: ${isRevealed ? '2px solid #ff9800' : 'none'};
        box-shadow: ${isRevealed ? '0 0 10px rgba(255,152,0,0.5)' : '0 1px 4px rgba(0,0,0,0.2)'};
        pointer-events: auto;
        z-index: 10;
      `;
      maskEl.innerHTML = isRevealed ? '✅' : '❓';
      maskEl.title = isRevealed ? '点击恢复遮挡' : '点击显示答案';
      
      maskEl.onclick = (e) => {
        e.stopPropagation();
        if (pdfMaskState.revealedMasks.includes(maskKey)) {
          // 已显示答案，点击恢复遮挡
          pdfMaskState.revealedMasks = pdfMaskState.revealedMasks.filter(k => k !== maskKey);
          maskEl.style.background = 'linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%)';
          maskEl.style.border = 'none';
          maskEl.style.boxShadow = '0 1px 4px rgba(0,0,0,0.2)';
          maskEl.innerHTML = '❓';
          maskEl.title = '点击显示答案';
        } else {
          // 遮挡状态，点击显示答案
          pdfMaskState.revealedMasks.push(maskKey);
          maskEl.style.background = 'transparent';
          maskEl.style.border = '2px solid #ff9800';
          maskEl.style.boxShadow = '0 0 10px rgba(255,152,0,0.5)';
          maskEl.innerHTML = '✅';
          maskEl.title = '点击恢复遮挡';
        }
        const countEl = document.getElementById('pdfMaskRevealedCount');
        if (countEl) countEl.textContent = pdfMaskState.revealedMasks.length;
      };
      
      container.appendChild(maskEl);
    });
    
    // 更新页码显示
    const pageInfoEl = document.getElementById('pdfMaskPageInfo');
    const prevBtn = document.getElementById('pdfMaskPrevBtn');
    const nextBtn = document.getElementById('pdfMaskNextBtn');
    const countEl = document.getElementById('pdfMaskRevealedCount');
    
    if (pageInfoEl) pageInfoEl.textContent = `第 ${pdfMaskState.currentPage} / ${card.pageCount || 1} 页`;
    if (prevBtn) prevBtn.disabled = pdfMaskState.currentPage <= 1;
    if (nextBtn) nextBtn.disabled = pdfMaskState.currentPage >= (card.pageCount || 1);
    if (countEl) countEl.textContent = pdfMaskState.revealedMasks.length;
    
  } catch (err) {
    console.error('PDF渲染失败:', err);
    const container = document.getElementById('pdfMaskContainer');
    if (container) {
      container.innerHTML = `<div style="color:white;text-align:center;padding:40px;">
        <div style="font-size:48px;margin-bottom:16px;">❌</div>
        <div style="font-size:16px;">PDF渲染失败</div>
        <div style="font-size:12px;color:#ccc;margin-top:8px;">${err.message}</div>
        <button style="margin-top:16px;padding:8px 24px;background:#6C5CE7;color:white;border:none;border-radius:8px;cursor:pointer;" onclick="goPage('cards')">返回题库</button>
      </div>`;
    }
  }
}

function pdfMaskChangePage(delta) {
  const card = pdfMaskState.card;
  if (!card) return;
  const newPage = Math.max(1, Math.min(card.pageCount || 1, pdfMaskState.currentPage + delta));
  pdfMaskState.currentPage = newPage;
  renderPdfMaskPage();
}

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      if (e.touches) {
        return {
          x: (e.touches[0].clientX - rect.left) * scaleX,
          y: (e.touches[0].clientY - rect.top) * scaleY
        };
      }
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    };
    
    const startDraw = (e) => {
      if (!drawMode) return; // 滚动模式：不拦截，允许滚动
      e.preventDefault();
      e.stopPropagation();
      isDrawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;
      points = [pos];
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.beginPath();
      drawCtx.moveTo(pos.x, pos.y);
      drawCtx.strokeStyle = '#6C5CE7';
      drawCtx.lineWidth = 4;
      drawCtx.lineCap = 'round';
    };
    
    const draw = (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      e.stopPropagation();
      const pos = getPos(e);
      points.push(pos);
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.stroke();
    };
    
    const endDraw = (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      
      if (points.length < 2) {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        return;
      }
      
      // 取起点的Y坐标（行高）和所有点的X范围
      const startPoint = points[0];
      const endPoint = points[points.length - 1];
      
      const minX = Math.min(startPoint.x, endPoint.x);
      const maxX = Math.max(startPoint.x, endPoint.x);
      const lineY = startPoint.y;
      
      // 行高（约30px）
      const lineHeight = 30;
      
      // 从划线位置往上一行高，坐标需要除以缩放比例以保存原始位置
      const scale = pdfEditorState.scale || 1;
      const mask = {
        page: currentPage,
        left: minX / scale,
        top: (lineY - lineHeight) / scale,
        width: (maxX - minX) / scale,
        height: lineHeight / scale
      };
      
      masks.push(mask);
      renderMasksList();
      renderCurrentPageMasks();
      
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      points = [];
      
      tip.textContent = `✅ 已添加 (${masks.length}个)`;
    };
    
    // 鼠标事件
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    
    // 触控事件
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    // 初始化划线模式
    updateDrawMode();
    
    // 清理函数
    window.clearMaskTip = () => {
      tip.remove();
      drawCanvas.remove();
      canvas.removeEventListener('mousedown', startDraw);
      canvas.removeEventListener('mousemove', draw);
      canvas.removeEventListener('mouseup', endDraw);
      canvas.removeEventListener('mouseleave', endDraw);
      canvas.removeEventListener('touchstart', startDraw);
      canvas.removeEventListener('touchmove', draw);
      canvas.removeEventListener('touchend', endDraw);
    };
  };
  
  const renderMasksList = () => {
    // 只更新计数，不再显示列表
    const countEl = document.getElementById('maskCountDisplay');
    if (countEl) countEl.textContent = masks.length;
  };
  
  window.removeMask = (index) => {
    masks.splice(index, 1);
    renderMasksList();
    renderCurrentPageMasks();
  };

  window.toggleDrawMode = () => {
    drawMode = !drawMode;
    updateDrawMode();
    const btn = document.getElementById('drawModeBtn');
    if (btn) {
      btn.textContent = drawMode ? '✍️ 划线中' : '📜 滚动中';
      btn.style.background = drawMode ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.3)';
    }
  };
  
  root.innerHTML = '';
  root.innerHTML = `
    <div class="modal" onclick="if(event.target===this)this.parentElement.innerHTML=''">
      <div style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:1000;background:white;">
        <div style="padding:12px 16px;background:linear-gradient(135deg,#6C5CE7,#A29BFE);color:white;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
          <div>
            <div style="font-size:12px;opacity:0.9;">📕 PDF遮挡编辑器</div>
            <div style="font-size:15px;font-weight:600;">${fileName}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:6px 12px;font-size:13px;" onclick="addMaskFromCanvas()">✍️ 添加遮挡</button>
            <button class="btn" id="drawModeBtn" style="background:rgba(255,255,255,0.2);color:white;border:none;padding:6px 12px;font-size:13px;" onclick="window.toggleDrawMode()">✍️ 划线中</button>
            <span style="font-size:12px;">遮挡: <span id="maskCountDisplay">${masks.length}</span>个</span>
            <span style="font-size:20px;cursor:pointer;" onclick="document.getElementById('modal-root').innerHTML=''">✕</span>
          </div>
        </div>
        
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;background:#f5f3ff;flex-shrink:0;">
          <button class="btn btn-outline" style="padding:6px 16px;" id="prevBtn" onclick="changePage(-1)">◀</button>
          <span style="flex:1;text-align:center;font-size:14px;font-weight:600;" id="pageInfo">第 ${currentPage} / ${pageCount} 页</span>
          <button class="btn btn-outline" style="padding:6px 16px;" id="nextBtn" onclick="changePage(1)">▶</button>
        </div>
        
        <div id="editorContainer" style="flex:1;overflow:auto;position:relative;background:#525659;" onclick="event.stopPropagation()">
          <canvas id="pdfCanvas" style="width:100%;height:auto;display:block;cursor:crosshair;"></canvas>
        </div>
        
        <div style="padding:12px 16px;background:#f9f9f9;flex-shrink:0;">
          <div style="display:flex;gap:8px;align-items:center;">
            <input id="pdfCardTag" class="form-input" placeholder="标签（可选）" style="flex:1;padding:8px 12px;">
            <div class="btn btn-outline" onclick="masks.length=0;renderMasksList();renderCurrentPageMasks();if(window.clearMaskTip)window.clearMaskTip();" style="border-color:#f53f3f;color:#f53f3f;padding:8px 12px;">清空</div>
            <div class="btn btn-primary" onclick="savePdfMaskCard()" style="padding:8px 20px;">💾 保存</div>
          </div>
        </div>
      </div>
    </div>
  `;
  
  // 保存卡片函数
  window.savePdfMaskCard = async () => {
    console.log('========== 保存卡片开始 ==========');
    console.log('pdfEditorState 当前状态:', JSON.stringify({
      pdfDataLength: pdfEditorState.pdfData ? pdfEditorState.pdfData.length : 'undefined',
      fileName: pdfEditorState.fileName,
      pageCount: pdfEditorState.pageCount,
      masksLength: pdfEditorState.masks.length
    }));
    
    // 从全局状态获取数据
    const pdfData = pdfEditorState.pdfData;
    const fileName = pdfEditorState.fileName;
    const pageCount = pdfEditorState.pageCount;
    const masks = pdfEditorState.masks;
    
    if (masks.length === 0) {
      alert('请至少添加一个遮挡区域');
      return;
    }
    
    console.log('开始保存PDF卡片...');
    console.log('pdfData类型:', Object.prototype.toString.call(pdfData));
    console.log('pdfData长度:', pdfData ? pdfData.length : 'undefined');
    
    // 检查 Uint8Array 是否有效
    if (pdfData instanceof Uint8Array) {
      console.log('pdfData 是 Uint8Array，字节长度:', pdfData.byteLength);
      console.log('pdfData 前10个字节:', pdfData.slice(0, 10));
    }
    
    if (!pdfData || !pdfData.length) {
      alert('PDF数据为空，请重新上传');
      return;
    }
    
    // 使用更可靠的方式将 Uint8Array 转换为 base64
    const base64 = uint8ArrayToBase64(pdfData);
    
    console.log('转换后的base64长度:', base64.length);
    
    // 验证转换是否正确
    try {
      const decodedBytes = base64ToUint8Array(base64);
      console.log('解码后长度:', decodedBytes.length);
      const header = String.fromCharCode(...decodedBytes.slice(0, 8));
      console.log('解码后文件头:', header);
    } catch (e) {
      console.error('base64验证失败:', e);
      alert('PDF数据转换失败: ' + e.message);
      return;
    }
    
    const tag = document.getElementById('pdfCardTag').value || fileName.replace('.pdf', '');
    const card = {
      id: generateUUID(),
      type: 'pdf-mask',
      fileName: fileName,
      pdfData: base64,
      pageCount: pageCount,
      masks: masks,
      subject: '专业课',
      tag: tag,
      srsLevel: 1,
      nextReview: new Date().toISOString().slice(0, 10),
      successCount: 0,
      failCount: 0,
      createdAt: new Date().toISOString(),
      userId: 'local'
    };
    
    cards = [card, ...cards];
    await saveCardsToSupabase(cards);
    document.getElementById('modal-root').innerHTML = '';
    // 停止状态监控
    stopStateMonitor();
    alert('PDF背题卡片已创建！共' + masks.length + '个遮挡区域');
    goPage('cards');
  };
  
  // 初始渲染
  await renderPage(1);
  renderMasksList();
}

// ========== Tab Bar Events ==========
document.querySelectorAll('.tab-item').forEach(el=>{
  el.addEventListener('click',()=>{
    const page=el.dataset.page
    if(page==='practice')practiceState={index:0,showAnswer:false,correct:0,wrongIds:[],userAnswer:''}
    if(examState.timer&&page!=='exam'){clearInterval(examState.timer);examState.timer=null}
    // 清除可能存在的 fixed 覆盖层
    const pdfMaskPage = document.getElementById('page-pdf-mask');
    if(pdfMaskPage) {
      pdfMaskPage.style.display = '';
      pdfMaskPage.innerHTML = '';
    }
    goPage(page)
  })
})

// ========== Init ==========
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js')
}
</script>
