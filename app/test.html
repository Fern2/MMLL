<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test</title>
</head>
<body>
  <div id="test"></div>
  <script>
    function h(tag, attrs, ...children) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'className') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'style') Object.assign(el.style, v);
        else el.setAttribute(k, v);
      }
      for (const c of children) {
        if (typeof c === 'string') el.appendChild(document.createTextNode(c));
        else if (c instanceof Node) el.appendChild(c);
      }
      return el;
    }
    
    const cards = [
      { id: '1', question: '测试问题1', answer: '答案1', subject: '专业课', tag: '测试', srsLevel: 1, nextReview: '2026-06-06', successCount: 1, failCount: 0 }
    ];
    
    document.getElementById('test').appendChild(
      h('div', {},
        h('div', { style: 'padding:16px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-radius:12px' },
          h('div', { style: 'font-size:20px;font-weight:700' }, '📝 刷题模式'),
          h('div', { style: 'font-size:13px;opacity:0.9' }, '测试知识掌握程度')
        ),
        h('div', { style: 'margin-top:16px;padding:16px;background:#f5f5f5;border-radius:12px' },
          h('div', { style: 'font-size:14px;font-weight:600' }, '今日任务'),
          h('div', { style: 'font-size:12px;color:#666' }, cards.length + '张待复习')
        )
      )
    );
    console.log('渲染成功!');
  </script>
</body>
</html>
