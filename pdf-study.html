<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF遮挡背题</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; color: #333; }
    .mode-switch { display: flex; gap: 8px; }
    .mode-btn { padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .mode-btn.active { background: #6C5CE7; color: white; }
    .mode-btn:not(.active) { background: white; color: #666; }
    
    /* Upload Area */
    .upload-area { border: 2px dashed #ddd; border-radius: 16px; padding: 60px 20px; text-align: center; cursor: pointer; margin-bottom: 20px; }
    .upload-area:hover { border-color: #6C5CE7; background: #f5f3ff; }
    #fileInput { display: none; }
    
    /* Saved Files List */
    .saved-list { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .saved-list h3 { margin-bottom: 16px; color: #333; }
    .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fafafa; border-radius: 10px; margin-bottom: 8px; }
    .saved-item:hover { background: #f0f0f0; }
    .saved-info { flex: 1; }
    .saved-name { font-weight: 500; color: #333; }
    .saved-meta { font-size: 12px; color: #999; margin-top: 4px; }
    .saved-actions { display: flex; gap: 8px; }
    .action-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .action-btn.open { background: #6C5CE7; color: white; }
    .action-btn.delete { background: #f53f3f; color: white; }
    
    /* PDF Content */
    .content-area { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .block { margin-bottom: 20px; padding: 16px; border-radius: 12px; background: #fafafa; position: relative; }
    .block.selected { background: #e8f5e9; border: 2px solid #00b42a; }
    .block-text { font-size: 16px; line-height: 1.8; color: #333; word-break: break-all; }
    
    /* Mask Styles */
    .mask { 
      position: absolute; 
      background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
      border-radius: 4px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
      opacity: 0.9;
    }
    .mask:hover { opacity: 0.7; }
    .mask.revealed { opacity: 0.3; }
    .mask::after {
      content: '点击显示';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
      white-space: nowrap;
    }
    .mask.revealed::after {
      content: '点击隐藏';
    }
    
    /* Toolbar */
    .toolbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: white; padding: 12px 24px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .tool-btn { padding: 10px 20px; border: none; border-radius: 25px; cursor: pointer; font-size: 14px; }
    .tool-btn.add { background: #6C5CE7; color: white; }
    .tool-btn.save { background: #00b42a; color: white; }
    .tool-btn.clear { background: #f53f3f; color: white; }
    .tool-btn.delete { background: #ff9500; color: white; }
    .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Selection Mode */
    .selection-hint { position: fixed; top: 20px; right: 20px; background: #ffc107; color: #333; padding: 12px 20px; border-radius: 8px; font-size: 14px; display: none; }
    .selection-hint.show { display: block; }
    
    /* Stats */
    .stats { display: flex; gap: 20px; margin-bottom: 20px; }
    .stat { background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .stat-value { font-size: 24px; font-weight: 700; color: #6C5CE7; }
    .stat-label { font-size: 12px; color: #999; margin-top: 4px; }
    
    /* Toast */
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 100; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 PDF遮挡背题</h1>
      <div class="mode-switch">
        <button class="mode-btn active" onclick="setMode('edit')">编辑模式</button>
        <button class="mode-btn" onclick="setMode('study')">背题模式</button>
      </div>
    </div>
    
    <div class="saved-list" id="savedList"></div>
    
    <div class="stats" id="stats" style="display: none;">
      <div class="stat">
        <div class="stat-value" id="blockCount">0</div>
        <div class="stat-label">段落数</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="maskCount">0</div>
        <div class="stat-label">遮挡数</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="revealCount">0</div>
        <div class="stat-label">已显示</div>
      </div>
    </div>
    
    <div class="upload-area" id="uploadArea">
      <div style="font-size: 48px; margin-bottom: 16px;">📁</div>
      <div style="font-size: 18px; margin-bottom: 8px;">点击或拖拽上传PDF文件</div>
      <div style="color: #999; font-size: 14px;">支持PDF格式，大小不限</div>
    </div>
    <input type="file" id="fileInput" accept=".pdf">
    
    <div class="content-area" id="contentArea" style="display: none;"></div>
    
    <div class="toolbar" id="toolbar" style="display: none;">
      <button class="tool-btn add" id="addMaskBtn" onclick="startSelection()">添加遮挡</button>
      <button class="tool-btn save" onclick="saveProgress()">保存进度</button>
      <button class="tool-btn delete" onclick="deleteSelected()">删除选中</button>
      <button class="tool-btn clear" onclick="clearAllMasks()">清除遮挡</button>
    </div>
    
    <div class="selection-hint" id="selectionHint">拖动鼠标选择要遮挡的文本区域</div>
    
    <div class="toast" id="toast"></div>
  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const contentArea = document.getElementById('contentArea');
    const toolbar = document.getElementById('toolbar');
    const stats = document.getElementById('stats');
    const savedList = document.getElementById('savedList');
    const selectionHint = document.getElementById('selectionHint');
    const toast = document.getElementById('toast');
    
    let currentMode = 'edit';
    let pdfContent = [];
    let masks = [];
    let pdfId = '';
    let fileName = '';
    let isSelecting = false;
    let selectionStart = null;
    let selectedBlocks = [];
    
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      if (mode === 'study') {
        masks.forEach(mask => {
          const el = document.getElementById('mask-' + mask.id);
          if (el) el.classList.remove('revealed');
        });
        document.getElementById('addMaskBtn').disabled = true;
        selectedBlocks = [];
        document.querySelectorAll('.block').forEach(b => b.classList.remove('selected'));
      } else {
        document.getElementById('addMaskBtn').disabled = false;
      }
      updateRevealCount();
    }
    
    async function loadSavedFiles() {
      const response = await fetch('/api/list');
      const data = await response.json();
      if (data.success) {
        if (data.files && data.files.length > 0) {
          savedList.innerHTML = '<h3>📂 已保存的文件</h3>' + 
            data.files.map(file => `
              <div class="saved-item">
                <div class="saved-info">
                  <div class="saved-name">${file.file_name}</div>
                  <div class="saved-meta">${file.mask_count}个遮挡 · ${formatDate(file.updated_at)}</div>
                </div>
                <div class="saved-actions">
                  <button class="action-btn open" onclick="openSavedFile('${file.pdf_id}', '${file.file_name}')">打开</button>
                  <button class="action-btn delete" onclick="deleteSavedFile('${file.id}', '${file.file_name}')">删除</button>
                </div>
              </div>
            `).join('');
        } else {
          savedList.style.display = 'none';
        }
      }
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleDateString('zh-CN');
    }
    
    async function openSavedFile(id, name) {
      showToast('正在加载...');
      const response = await fetch('/api/get?pdfId=' + encodeURIComponent(id));
      const data = await response.json();
      
      if (data.success) {
        pdfId = id;
        fileName = name;
        pdfContent = data.blocks;
        masks = data.masks || [];
        renderContent();
      } else {
        showToast('加载失败');
      }
    }
    
    async function deleteSavedFile(id, name) {
      if (!confirm('确定要删除 "' + name + '" 吗？')) return;
      
      const response = await fetch('/api/delete?id=' + id, { method: 'DELETE' });
      const data = await response.json();
      
      if (data.success) {
        showToast('删除成功');
        loadSavedFiles();
        if (pdfId) {
          uploadArea.style.display = 'block';
          contentArea.style.display = 'none';
          toolbar.style.display = 'none';
          stats.style.display = 'none';
          pdfId = '';
          pdfContent = [];
          masks = [];
        }
      } else {
        showToast('删除失败');
      }
    }
    
    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#6C5CE7'; });
    uploadArea.addEventListener('dragleave', () => uploadArea.style.borderColor = '#ddd');
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.style.borderColor = '#ddd';
      const files = e.dataTransfer.files;
      if (files.length > 0) handleFile(files[0]);
    });
    
    fileInput.addEventListener('change', e => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });
    
    async function handleFile(file) {
      if (file.type !== 'application/pdf') {
        showToast('请选择PDF文件');
        return;
      }
      
      showToast('正在解析PDF...');
      
      const formData = new FormData();
      formData.append('pdf', file);
      
      const response = await fetch('/api/parse', { method: 'POST', body: formData });
      const data = await response.json();
      
      if (data.success) {
        pdfId = data.pdfId;
        fileName = file.name;
        pdfContent = data.blocks;
        masks = [];
        renderContent();
      } else {
        showToast('解析失败: ' + data.message);
      }
    }
    
    function renderContent() {
      uploadArea.style.display = 'none';
      contentArea.style.display = 'block';
      toolbar.style.display = 'flex';
      stats.style.display = 'flex';
      
      contentArea.innerHTML = pdfContent.map((block, blockIndex) => {
        return '<div class="block" id="block-' + blockIndex + '" data-block="' + blockIndex + '" onclick="toggleBlockSelect(' + blockIndex + ')">' +
               '<div class="block-text">' + escapeHtml(block) + '</div>' +
               '</div>';
      }).join('');
      
      masks.forEach(renderMask);
      updateStats();
    }
    
    function toggleBlockSelect(index) {
      if (currentMode === 'study') return;
      
      const blockEl = document.getElementById('block-' + index);
      if (!blockEl) return;
      
      const idx = selectedBlocks.indexOf(index);
      if (idx > -1) {
        selectedBlocks.splice(idx, 1);
        blockEl.classList.remove('selected');
      } else {
        selectedBlocks.push(index);
        blockEl.classList.add('selected');
      }
    }
    
    function deleteSelected() {
      if (selectedBlocks.length === 0) {
        showToast('请先选择要删除的段落');
        return;
      }
      
      selectedBlocks.sort((a, b) => b - a).forEach(index => {
        pdfContent.splice(index, 1);
        masks = masks.filter(m => m.blockIndex !== index);
        masks.forEach(m => {
          if (m.blockIndex > index) m.blockIndex--;
        });
      });
      
      selectedBlocks = [];
      renderContent();
      showToast('已删除 ' + selectedBlocks.length + ' 个段落');
    }
    
    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    
    function renderMask(mask) {
      const blockEl = document.getElementById('block-' + mask.blockIndex);
      if (!blockEl) return;
      
      const maskEl = document.createElement('div');
      maskEl.className = 'mask' + (mask.revealed ? ' revealed' : '');
      maskEl.id = 'mask-' + mask.id;
      maskEl.style.left = mask.x + 'px';
      maskEl.style.top = mask.y + 'px';
      maskEl.style.width = mask.width + 'px';
      maskEl.style.height = mask.height + 'px';
      maskEl.addEventListener('click', (e) => { e.stopPropagation(); toggleMask(mask.id); });
      maskEl.addEventListener('contextmenu', (e) => { e.preventDefault(); deleteMask(mask.id); });
      
      blockEl.appendChild(maskEl);
    }
    
    function toggleMask(maskId) {
      const mask = masks.find(m => m.id === maskId);
      if (!mask) return;
      
      mask.revealed = !mask.revealed;
      const el = document.getElementById('mask-' + maskId);
      if (el) el.classList.toggle('revealed');
      
      updateRevealCount();
    }
    
    function deleteMask(maskId) {
      if (!confirm('确定要删除这个遮挡吗？')) return;
      
      masks = masks.filter(m => m.id !== maskId);
      const el = document.getElementById('mask-' + maskId);
      if (el) el.remove();
      
      updateStats();
      showToast('遮挡已删除');
    }
    
    function startSelection() {
      isSelecting = true;
      selectionHint.classList.add('show');
      
      document.addEventListener('mousedown', onMouseDown);
      document.addEventListener('mouseup', onMouseUp);
    }
    
    function onMouseDown(e) {
      if (!isSelecting) return;
      const target = e.target;
      const blockEl = target.closest('.block');
      if (!blockEl) return;
      
      const rect = blockEl.getBoundingClientRect();
      selectionStart = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        blockIndex: parseInt(blockEl.dataset.block)
      };
      
      document.addEventListener('mousemove', onMouseMove);
    }
    
    function onMouseMove(e) {
      if (!selectionStart) return;
      
      const blockEl = document.getElementById('block-' + selectionStart.blockIndex);
      const rect = blockEl.getBoundingClientRect();
      
      const endX = e.clientX - rect.left;
      const endY = e.clientY - rect.top;
      
      const x = Math.min(selectionStart.x, endX);
      const y = Math.min(selectionStart.y, endY);
      const width = Math.abs(endX - selectionStart.x);
      const height = Math.abs(endY - selectionStart.y);
      
      if (width > 10 && height > 10) {
        const mask = {
          id: Date.now().toString(36),
          blockIndex: selectionStart.blockIndex,
          x, y, width, height,
          revealed: false
        };
        
        masks.push(mask);
        renderMask(mask);
        
        selectionStart = null;
        updateStats();
      }
    }
    
    function onMouseUp() {
      isSelecting = false;
      selectionHint.classList.remove('show');
      selectionStart = null;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mousedown', onMouseDown);
      document.removeEventListener('mouseup', onMouseUp);
    }
    
    async function saveProgress() {
      showToast('正在保存...');
      
      const response = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pdfId, fileName, blocks: pdfContent, masks })
      });
      
      const data = await response.json();
      if (data.success) {
        showToast('保存成功！');
        loadSavedFiles();
      } else {
        showToast('保存失败: ' + data.message);
      }
    }
    
    function clearAllMasks() {
      masks = [];
      document.querySelectorAll('.mask').forEach(el => el.remove());
      updateStats();
      showToast('已清除所有遮挡');
    }
    
    function updateStats() {
      document.getElementById('blockCount').textContent = pdfContent.length;
      document.getElementById('maskCount').textContent = masks.length;
      updateRevealCount();
    }
    
    function updateRevealCount() {
      const revealed = masks.filter(m => m.revealed).length;
      document.getElementById('revealCount').textContent = revealed;
    }
    
    loadSavedFiles();
  </script>
</body>
</html>
